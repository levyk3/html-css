<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 013</title>
    <style>
        body{
            /*ESSA CONFIGURAÇÃO É OARA CENTRALIZAR */
            background-color: aqua;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        table{
            border-collapse: separate;
            background-color: aliceblue;
            width: 300px;
            height: 300px;
            text-align: center;
            
        }
        td{
            border: 2px solid black;
            padding: 10px;
        }

        .cabeça{
            background-color: black;
            color: aliceblue;
        }
    </style>
</head>
<body>
    <!--PARA A TABELA PODER FUNCINAR IGUAL NO EXERCÍCIO-->
    <table>
        <tr>
            <td class="cabeça">A</td>
            <td class="cabeça">B</td>
            <td class="cabeça">C</td>
            <td class="cabeça">D</td>
        <tr>
            <td>1</td>
            <td>2</td>
            <td rowspan="2">3</td>
            <td>4</td>
            
        </tr>
        <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
           
        </tr>
        <tr>
            <td colspan="3">8</td>
            <td>9</td>
        </tr>
        <tr>
            <td rowspan="2">10</td>
            <td colspan="2">11</td>
            <td>12</td>
           
        </tr>
        <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td>
        </tr>
    
    </table>
</body>
</html>
