    <h1>Tegs HTML</h1>
    <P>Em HTML, podemos inserir os elementos da tags. Passe o mouse sobre os termos para qual tag deverá utilizar em cada caso.</P>
    <ul>
        <li>
           <p><abbr title="Use a tag &lt;p&gt">Paragrafo</abbr> </p> 
        </li>

        <li><p><abbr title="Use as tgas &lt;img&gt;&lt;str&gt">Imagem</abbr></p></li>
        <li><p><abbr title="Use a tag &lt;abbr&gt">Abreviações</abbr></p></li>
        <li><p><abbr title="Use a teg &lt;code&gt">Código fonte</abbr></p></li>
        <li><p><abbr title="Use a tag &lt;ol&gt">listas númericas</abbr></p></li>
        <li><p><abbr title="Use a teg &lt;ul&gt">Lista com demarcadores</abbr></p></li>
    </ul>
